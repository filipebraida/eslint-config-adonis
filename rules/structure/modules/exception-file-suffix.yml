id: exception-file-suffix
language: typescript
files: ['app/*/exceptions/**/*.ts']
# The global handler lives in the core module, where adonisrc points.
ignores: ['app/*/exceptions/**/*_exception.ts', 'app/core/exceptions/handler.ts']
severity: error
metadata:
  description: "Files in `<module>/exceptions/` end in `_exception.ts`, except the global `core/exceptions/handler.ts`"
message: 'File in exceptions/ without the `_exception.ts` suffix.'
note: 'Name it `<name>_exception.ts`, the name `node ace make:exception` writes. Only the global `app/core/exceptions/handler.ts` has no suffix.'
rule:
  kind: program
