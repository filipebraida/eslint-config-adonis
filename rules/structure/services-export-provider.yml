id: services-export-provider
language: typescript
files: ['app/services/**/*.ts', 'app/*/services/**/*.ts']
ignores: ['app/*/tests/**']
severity: error
metadata:
  description: "`services/` holds swappable providers: it exports classes, interfaces, types and constants, never a loose function"
message: '`$NAME` is a loose function in `services/`.'
note: 'A service is a provider another implementation can replace (an external client, a port another module implements): a class, injected where it is used, or the interface it implements. A function about the domain goes to the model (a method, a getter, a static helper) or next to its enum, and a read that decides goes to a query. Only a function with no domain that several layers share (a slug, a CSV line) goes to the one utils of the app, `app/utils/` (`app/core/utils/` in the modules layout).'
rule:
  kind: export_statement
  any:
    # export function x() {}, export default function x() {}, export async function x() {}
    - has:
        field: declaration
        any: [{ kind: function_declaration }, { kind: generator_function_declaration }]
        has: { field: name, pattern: $NAME }
    - all:
        - regex: '^export\s+default\b'
        - has: { field: value, any: [{ kind: function_expression }, { kind: arrow_function }], pattern: $NAME }
    # export const x = () => {}, export const x = function () {}
    - has:
        field: declaration
        kind: lexical_declaration
        has:
          kind: variable_declarator
          all:
            - has: { field: name, pattern: $NAME }
            - has: { field: value, any: [{ kind: arrow_function }, { kind: function_expression }] }
