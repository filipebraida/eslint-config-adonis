id: controller-no-authenticate
language: typescript
files: ['app/controllers/**/*.ts', 'app/*/controllers/**/*.ts']
severity: error
metadata:
  description: "No `auth.authenticate()`/`authenticateUsing()` in a controller; the `auth` middleware authenticates, the controller calls `auth.getUserOrFail()`"
message: '`auth.$METHOD()` in a controller: the route should already be authenticated.'
note: 'Protect the route with `middleware.auth()` and read the user with `auth.getUserOrFail()`.'
rule:
  kind: call_expression
  has:
    field: function
    kind: member_expression
    all:
      - has: { field: property, pattern: $METHOD, regex: '^(authenticate|authenticateUsing)$' }
      - has:
          field: object
          any:
            - { kind: identifier, regex: '^auth$' }
            - has: { stopBy: end, any: [{ kind: identifier, regex: '^auth$' }, { kind: property_identifier, regex: '^auth$' }] }
