id: controller-crud-methods
language: typescript
files: ['app/controllers/**/*_controller.ts', 'app/*/controllers/**/*_controller.ts']
severity: error
metadata:
  description: "Public methods are only index, show, create, store, edit, update, destroy; another verb is another resource named by its noun (no `handle()`)"
message: '`$NAME()` is not a CRUD method (index, show, create, store, edit, update, destroy).'
note: 'The verb is another resource, named by its noun, with a CRUD method: `PostsController.archive` becomes `PostArchivalsController.update` (`PUT /posts/:id/archival`), `duplicate` becomes `PostCopiesController.store`. A single-action controller with `handle()` is the same violation.'
rule:
  kind: method_definition
  inside: { kind: class_body }
  has: { field: name, pattern: $NAME }
  not:
    any:
      - has: { field: name, regex: '^(index|show|create|store|edit|update|destroy|constructor)$' }
      - has: { field: name, kind: private_property_identifier }
      - has: { kind: accessibility_modifier, regex: '^(private|protected)$' }
      # Static members, getters and setters are not actions.
      - regex: '^(public\s+)?(static|get|set)\b'
