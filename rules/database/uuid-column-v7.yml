id: uuid-column-v7
language: typescript
files: ['database/migrations/**/*.ts', 'app/*/database/migrations/**/*.ts']
severity: error
metadata:
  description: "The public `uuid` column defaults to `this.raw('uuidv7()')`"
message: 'uuid column without the database default `uuidv7()`.'
note: 'The public identifier is generated by PostgreSQL 18: `table.uuid(''uuid'').notNullable().unique().defaultTo(this.raw(''uuidv7()''))`. Joins and foreign keys keep the integer `id`; never a uuid foreign key, never a v4.'
rule:
  kind: expression_statement
  has:
    stopBy: end
    kind: call_expression
    all:
      - has: { field: function, kind: member_expression, has: { field: property, regex: '^uuid$' } }
      # The public identifier column; a uuid that comes from another system keeps no default.
      - has: { field: arguments, has: { nthChild: 1, regex: '^[''"]uuid[''"]$' } }
  not: { regex: "uuidv7\\(\\)" }
