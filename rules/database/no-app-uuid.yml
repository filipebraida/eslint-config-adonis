id: no-app-uuid
language: tsx
files: ['app/**/*.ts', 'start/**/*.ts', 'database/**/*.ts']
# The screens may key ephemeral client state with randomUUID().
ignores: ['app/*/tests/**', 'app/*/ui/**']
severity: error
metadata:
  description: "No `randomUUID()`, `v4()`, `v7()` in the server; the database generates the uuid"
message: 'uuid generated by the application (`$CALL`).'
note: 'The database generates the public identifier with `uuidv7()` as the column default. The model reads it after the insert: `@afterCreate() static async refreshUuid(row) { await row.refresh() }`.'
rule:
  pattern: $CALL
  any:
    - kind: call_expression
      has: { field: function, regex: '(^|\.)(randomUUID|uuidv4|v4|uuidv7|v7)$' }
    - kind: import_statement
      all:
        - has: { field: source, regex: '^[''"](uuid|node:crypto|crypto)[''"]$' }
        - has: { stopBy: end, kind: import_specifier, regex: '^(randomUUID|v4|v7)\b' }
