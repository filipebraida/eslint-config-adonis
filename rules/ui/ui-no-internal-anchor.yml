id: ui-no-internal-anchor
language: tsx
files: ['inertia/**/*.{ts,tsx}', 'app/*/ui/**/*.{ts,tsx}']
severity: error
metadata:
  description: "No `<a href=\"/...\">`; `<Link route>` for Inertia pages, `href={urlFor(...)}` otherwise"
message: '`<a href>` with a hard-coded internal URL.'
note: 'For an Inertia page use `<Link route="articles.show" params={{ id }}>`: it navigates without a full reload. For a page outside Inertia (a mounted dashboard, a download, a new tab) keep `<a>` with `href={urlFor(''files.download'', { id })}`. External, `mailto:` and `#anchor` links are fine.'
rule:
  kind: jsx_attribute
  has: { kind: property_identifier, regex: '^href$' }
  all:
    - has:
        stopBy: end
        any:
          - { kind: string, regex: '^[''"]/([^/]|[''"])' }
          - { kind: template_string, regex: '^`/([^/]|`)' }
    - inside:
        any:
          - { kind: jsx_opening_element, has: { field: name, regex: '^a$' } }
          - { kind: jsx_self_closing_element, has: { field: name, regex: '^a$' } }
