id: page-renders-head
language: tsx
files: ['inertia/pages/**/*.tsx', 'app/*/ui/pages/**/*.tsx']
# A modal page (`form.tsx`, `<entity>_form.tsx`) renders over the page that opened it and keeps its title.
ignores: ['inertia/pages/**/form.tsx', 'inertia/pages/**/*_form.tsx', 'app/*/ui/pages/**/form.tsx', 'app/*/ui/pages/**/*_form.tsx']
severity: error
metadata:
  description: "A page renders `<Head>` from `@inertiajs/react`; `PageHead`, `TableHead` or a wrapper do not count; a modal page (`form.tsx`, `*_form.tsx`) is exempt"
message: 'Page without `<Head>` from `@inertiajs/react`.'
note: 'Every page sets its own title: `import { Head } from ''@inertiajs/react''` and `<Head title={t(''deliveries.show.title'')} />`, next to the shared `PageHead` that draws the heading on the screen. `PageHead` does not set the title, and a layout that sets a default one does not name this page. A modal page is named `form.tsx` (or `<entity>_form.tsx`) and keeps the title of the page under it.'
rule:
  kind: export_statement
  regex: '^export\s+default\b'
  not:
    inside:
      kind: program
      all:
        - has:
            kind: import_statement
            all:
              - has: { field: source, regex: '^[''"]@inertiajs/react[''"]$' }
              - has: { stopBy: end, kind: import_specifier, has: { field: name, regex: '^Head$' } }
        - has:
            stopBy: end
            any: [{ kind: jsx_opening_element }, { kind: jsx_self_closing_element }]
            has: { field: name, regex: '^Head$' }
