valid:
  - file: app/deliveries/ui/pages/deliveries/show.tsx
    code: |
      import { Head } from '@inertiajs/react'
      export default function Show() {
        return (
          <HubLayout>
            <Head title={t('deliveries.show.title')} />
            <PageHead title={t('deliveries.show.title')} />
          </HubLayout>
        )
      }
  # The component is declared above and exported by name.
  - file: inertia/pages/posts/index.tsx
    code: |
      import { Head, Link } from '@inertiajs/react'
      function Index() {
        return <><Head title="Posts" /><main /></>
      }
      export default Index
  # agencia: a modal page (`form.tsx`, `<entity>_form.tsx`) keeps the title of the page under it.
  - file: app/auth/ui/pages/papeis/form.tsx
    code: |
      import { Modal } from 'adonis-inertia-modal/react'
      export default function PapelFormModal() {
        return <Modal maxWidth="lg"><h2>x</h2></Modal>
      }
  - file: app/conteudo/ui/pages/taxonomia/tag_form.tsx
    code: |
      import { Modal } from 'adonis-inertia-modal/react'
      export default function TagFormModal() { return <Modal><form /></Modal> }
  # A modal page by what it returns: the root is the modal, whatever the file name.
  - file: app/users/ui/pages/users/create.tsx
    code: |
      import { Modal } from 'adonis-inertia-modal/react'
      export default function CreateUser() { return <Modal><form /></Modal> }
  # expora: the project modal wraps the library one.
  - file: inertia/pages/bloqueios/create.tsx
    code: |
      import { ModalDeFormulario } from '~/components/app/modal_de_formulario'
      export default function Bloquear({ nome }) {
        return (
          <ModalDeFormulario titulo="Bloquear inscrição" rotulo="Bloquear">
            <textarea name="motivo" />
          </ModalDeFormulario>
        )
      }
  - file: app/deliveries/ui/components/deliveries/card.tsx
    code: 'export default function Card() { return <div /> }'
invalid:
  - file: app/deliveries/ui/pages/board/show.tsx
    code: |
      export default function BoardShow() {
        return <HubLayout><h1>Board</h1></HubLayout>
      }
  # PageHead draws the heading, it does not set the title.
  - file: app/pessoas/ui/pages/pessoas/index.tsx
    code: |
      export default function PessoasIndexPage() {
        return <AdminLayout><PageHead titulo="Pessoas" /></AdminLayout>
      }
  - file: inertia/pages/posts/index.tsx
    code: |
      function Index() { return <main /> }
      export default Index
  # A table header is not the page head.
  - file: app/users/ui/pages/users/index.tsx
    code: |
      export default function UsersIndex() {
        return <Table><TableHeader><TableRow><TableHead>Name</TableHead></TableRow></TableHeader></Table>
      }
  # agencia tokens/index: a full page that imports a modal component is not a modal page.
  - file: app/auth/ui/pages/tokens/index.tsx
    code: |
      import TokensGeneratedModal from '#auth/ui/components/tokens/tokens_generated_modal'
      export default function TokensPage() { return <AdminLayout><TokensGeneratedModal /></AdminLayout> }
  # A wrapper that is not Head.
  - file: app/portal/ui/pages/noticias/show.tsx
    code: |
      export default function Page({ seo }) {
        return <PortalLayout><SeoHead {...seo} type="article" /></PortalLayout>
      }
  # A Head from another package.
  - file: inertia/pages/posts/show.tsx
    code: |
      import { Head } from 'some-seo-lib'
      export default function Show() { return <Head title="x" /> }
  # A modal returned by a callback or an inner function is not the root of the page.
  - file: inertia/pages/posts/index.tsx
    code: |
      export default function Index({ posts }) {
        return <Layout>{posts.map((post) => { return <PostModal post={post} /> })}</Layout>
      }
  - file: inertia/pages/posts/show.tsx
    code: |
      export default function Show() {
        function Confirm() { return <Modal /> }
        return <Layout><Confirm /></Layout>
      }
