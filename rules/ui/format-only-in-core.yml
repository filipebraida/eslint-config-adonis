id: format-only-in-core
language: tsx
files: ['app/*/ui/**/*.{ts,tsx}', 'inertia/**/*.{ts,tsx}']
ignores: ['app/core/ui/format*/**', 'inertia/lib/format*/**', 'inertia/lib/format*.ts']
severity: error
metadata:
  description: "Screens format dates and numbers only through the shared formatters (`app/core/ui/format/`, `inertia/lib/format/`): no `Intl.*`, `toLocaleString/DateString/TimeString()` or Luxon `toFormat/toRelative()` elsewhere"
message: '`$CALL` formats outside the shared formatters.'
note: 'Dates, numbers and relative times go through one formatter in `app/core/ui/format/` (`inertia/lib/format/` in the flat layout), which takes the locale of the user: `formatDate(value, locale)`, `formatRelativeTime(value, locale)`. Formatting scattered across screens drifts (one screen shows `02/11`, another `Nov 2`) and ignores the user locale.'
rule:
  any:
    # new Intl.DateTimeFormat(...), Intl.NumberFormat(...)
    - kind: member_expression
      pattern: $CALL
      has: { field: object, kind: identifier, regex: '^Intl$' }
    # date.toLocaleDateString(), value.toLocaleString('pt-BR'), Luxon
    # dt.toLocaleString(DateTime.DATE_MED), dt.toFormat('dd/LL'), dt.toRelative()
    - kind: call_expression
      pattern: $CALL
      has:
        field: function
        kind: member_expression
        has: { field: property, regex: '^(toLocale(String|DateString|TimeString)|toLocaleParts|toFormat|toRelative|toRelativeCalendar)$' }
