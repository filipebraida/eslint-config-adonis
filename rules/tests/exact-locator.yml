id: exact-locator
language: tsx
files: ['tests/**/*.{ts,tsx}', 'app/*/tests/**/*.{ts,tsx}']
severity: error
metadata:
  description: "Playwright text locators pass `exact`, so \"Sign in\" does not find \"Sign in with code\""
message: '`$METHOD` without `exact` matches by substring: "Sign in" also finds "Sign in with code".'
note: 'Pass `{ exact: true }`, or `{ exact: false }` when a partial match is intended.'
utils:
  # Options the rule can read (an object literal without spread) that lack `exact`.
  options-without-exact:
    kind: object
    not:
      any:
        - has: { kind: spread_element }
        - has: { kind: pair, has: { field: key, regex: '^[''"]?exact[''"]?$' } }
        - has: { kind: shorthand_property_identifier, regex: '^exact$' }
  # Testing Library's `screen` already matches the whole text by default.
  locator-call:
    kind: call_expression
    has:
      field: function
      kind: member_expression
      not: { has: { field: object, kind: identifier, regex: '^screen$' } }
rule:
  any:
    # getByText('Sign in') / getByText('Sign in', { timeout: 10 })
    - all:
        - matches: locator-call
        - has:
            field: function
            has: { field: property, pattern: $METHOD, regex: '^(getByLabel|getByText|getByPlaceholder|getByTitle|getByAltText)$' }
        - has:
            field: arguments
            all:
              - not: { has: { nthChild: 1, kind: regex } }
              - any:
                  - not: { has: { nthChild: 2 } }
                  - has: { nthChild: 2, matches: options-without-exact }
    # getByRole('button', { name: 'Sign in' })
    - all:
        - matches: locator-call
        - has: { field: function, has: { field: property, pattern: $METHOD, regex: '^getByRole$' } }
        - has:
            field: arguments
            has:
              nthChild: 2
              matches: options-without-exact
              has:
                kind: pair
                has: { field: key, regex: '^[''"]?name[''"]?$' }
                not: { has: { field: value, kind: regex } }
