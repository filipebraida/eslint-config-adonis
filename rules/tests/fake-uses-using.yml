id: fake-uses-using
language: tsx
files: ['tests/**/*.{ts,tsx}', 'app/*/tests/**/*.{ts,tsx}']
severity: error
metadata:
  description: "`mail`, `emitter`, `drive` and `facteur` fakes are created with `using`; no `.restore()`"
message: '`$X.$METHOD()` outside a `using` declaration: the fake is restored by hand, or not at all, and leaks into the next test when an assertion throws first.'
note: 'Write `using fake = $X.fake()` inside the test: the fake is restored when the test ends, even on failure, so `$X.restore()` is never needed.'
rule:
  any:
    # mail.fake() as a statement, or in a const/let
    - kind: call_expression
      all:
        - has:
            field: function
            kind: member_expression
            all:
              - has: { field: object, kind: identifier, pattern: $X, regex: '^(mail|emitter|drive|facteur)$' }
              - has: { field: property, pattern: $METHOD, regex: '^fake$' }
        # `using fake = mail.fake()` parses as an assignment with a `using` token.
        - not: { inside: { kind: assignment_expression, regex: '^using\s' } }
    # mail.restore(): with `using` the fake restores itself
    - kind: call_expression
      has:
        field: function
        kind: member_expression
        all:
          - has: { field: object, kind: identifier, pattern: $X, regex: '^(mail|emitter|drive|facteur)$' }
          - has: { field: property, pattern: $METHOD, regex: '^restore$' }
