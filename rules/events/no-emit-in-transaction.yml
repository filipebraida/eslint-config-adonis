id: no-emit-in-transaction
language: typescript
files: ['app/**/*.ts']
ignores: ['app/*/tests/**']
severity: error
metadata:
  description: "No `emitter.emit`/`emitSerial` or `X.dispatch` (events and jobs) inside a `.transaction()` callback; emit after the commit"
message: '`$CALL` inside a transaction: listeners and jobs run before the commit, read data that is not there yet, and still run when it rolls back.'
note: 'Return what the event needs from the transaction callback and emit after it: `const review = await db.transaction(async (trx) => ...)`, then `await emitter.emit(...)`.'
rule:
  any:
    # emitter.emit('review:registered', review), emitter.emitSerial(...)
    - kind: call_expression
      pattern: $CALL
      has:
        field: function
        kind: member_expression
        all:
          - has: { field: object, kind: identifier, regex: '^emitter$' }
          - has: { field: property, regex: '^(emit|emitSerial)$' }
    # ReviewRegistered.dispatch(review), events.ReviewRegistered.dispatch(review), SendWelcomeJob.dispatch(payload)
    - kind: call_expression
      pattern: $CALL
      has:
        field: function
        kind: member_expression
        all:
          - has: { field: object, regex: '(^|\.)[A-Z][A-Za-z0-9_]*$' }
          - has: { field: property, regex: '^(dispatch|dispatchMany)$' }
  inside:
    stopBy: end
    kind: call_expression
    # db.transaction(cb), Database.transaction(cb), trx.transaction(cb)
    has:
      field: function
      kind: member_expression
      has: { field: property, regex: '^transaction$' }
