id: emitter-on-in-start-events
language: typescript
files: ['app/**/*.ts', 'start/**/*.ts', 'providers/**/*.ts']
ignores: ['start/events.ts', 'app/*/start/events.ts', 'app/*/tests/**']
severity: error
metadata:
  description: "`emitter.on/once/listen` only in `start/events.ts` (or the module's)"
message: '`emitter.$METHOD()` outside start/events.ts.'
note: 'Every binding lives in `start/events.ts` (or the module''s `start/events.ts`): `emitter.on(events.PostPublished, [listeners.SchedulePostNotifications])`. It is the one place that shows who reacts to what.'
rule:
  kind: call_expression
  has:
    field: function
    kind: member_expression
    all:
      - has: { field: object, regex: '(^|\.)emitter$' }
      - has: { field: property, pattern: $METHOD, regex: '^(on|once|onAny|listen)$' }
