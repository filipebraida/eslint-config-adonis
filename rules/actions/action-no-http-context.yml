id: action-no-http-context
language: typescript
files: ['app/actions/**/*.ts', 'app/*/actions/**/*.ts']
severity: error
metadata:
  description: "Actions do not import `HttpContext` as a value (`import type` is fine)"
message: 'Action receives HttpContext.'
note: 'The controller extracts what the action needs and passes it as plain input. A type-only import (`import type`) is fine.'
rule:
  kind: import_statement
  all:
    - has: { field: source, regex: '^[''"]@adonisjs/core/http[''"]$' }
    - not: { regex: '^import\s+type\b' }
    - has:
        stopBy: end
        kind: import_specifier
        regex: '^HttpContext\b'
